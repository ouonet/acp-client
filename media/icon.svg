<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="60%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </radialGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="50%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#f38ba8"/>
    </linearGradient>

    <!-- Core Neural Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89dceb"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#b4befe"/>
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Subtle Circuit Lattice Background -->
  <g opacity="0.12" stroke="#cdd6f4" stroke-width="2" stroke-dasharray="6,6">
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <circle cx="256" cy="256" r="140" fill="none"/>
  </g>

  <!-- Outer Interconnected Node Ring -->
  <g filter="url(#glow)">
    <!-- Circuit Lines -->
    <path d="M140 180 L256 114 L372 180 L372 312 L256 378 L140 312 Z" 
          fill="none" 
          stroke="url(#rimGrad)" 
          stroke-width="5" 
          stroke-linejoin="round"
          opacity="0.8"/>

    <!-- Left Bracket < -->
    <path d="M190 200 L140 256 L190 312" 
          fill="none" 
          stroke="url(#coreGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Bracket > -->
    <path d="M322 200 L372 256 L322 312" 
          fill="none" 
          stroke="url(#coreGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central Neural Diamond Core -->
    <polygon points="256,180 306,256 256,332 206,256" 
             fill="url(#coreGrad)" 
             opacity="0.15"/>
    <polygon points="256,180 306,256 256,332 206,256" 
             fill="none" 
             stroke="url(#coreGrad)" 
             stroke-width="8" 
             stroke-linejoin="round"/>

    <!-- Center Pulse Sphere -->
    <circle cx="256" cy="256" r="22" fill="#89dceb"/>
    <circle cx="256" cy="256" r="10" fill="#ffffff"/>

    <!-- Satellite Nodes -->
    <circle cx="256" cy="114" r="10" fill="#89b4fa"/>
    <circle cx="372" cy="180" r="10" fill="#cba6f7"/>
    <circle cx="372" cy="312" r="10" fill="#f38ba8"/>
    <circle cx="256" cy="378" r="10" fill="#cba6f7"/>
    <circle cx="140" cy="312" r="10" fill="#89b4fa"/>
    <circle cx="140" cy="180" r="10" fill="#89dceb"/>
  </g>

  <!-- Bottom Brandmark "ACP" -->
  <text x="256" y="442" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="10" 
        fill="#cdd6f4" 
        text-anchor="middle" 
        opacity="0.9">ACP</text>
</svg>
